name: Build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore GrevUltraVNC.slnx
      - name: Build solution
        run: dotnet build GrevUltraVNC.slnx --configuration Release --no-restore

      - name: Smoke test GrevUltraVNC startup
        shell: powershell
        run: |
          $exe = Resolve-Path 'src\GrevUltraVNC\bin\Release\net10.0-windows\GrevUltraVNC.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            throw "GrevUltraVNC exited during startup smoke test with exit code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build GrevUltraVNC 1.1.7 friend installer
        shell: powershell
        run: .\scripts\build-friend-installer.ps1

      - name: Build Grev Agent package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: .\scripts\build-agent-package.ps1

      - name: Publish latest Grev Agent release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'agent-latest'
          $asset = 'dist\GrevUltraVNC-Agent-win-x64.zip'

          cmd /c "gh release view $tag --repo $env:GITHUB_REPOSITORY >nul 2>nul"
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the agent-latest release asset.' }
          }
          else {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --title 'GrevUltraVNC Agent - Latest' --notes 'Automatically built from the latest main branch.' --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the agent-latest release.' }
          }

      - name: Publish GrevUltraVNC 1.1.7 friend release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.1.7-friend'
          $asset = 'dist\GrevUltraVNC-1.1.7-Friend-Setup.exe'
          $notes = @(
            'GrevUltraVNC 1.1.7 Friend Test'
            ''
            '- Keeps the full stupid/rude/childish installer from 1.1.6.'
            '- Shortens every joke navigation button so the captions actually fit inside the buttons.'
            '- Adds a completely pointless Mandatory Englishness Checkpoint with a proper St George cross built directly into the installer UI.'
            '- Adds a second completely pointless Critical Biscuit Compatibility Test whose answer is deliberately ignored.'
            '- The British page asks for weather complaining, orderly queueing, tutting and apologising to furniture before continuing.'
            '- The biscuit page offers Custard Cream, Digestive, Hobnob, Rich Tea or suspicious no-biscuit behaviour.'
            '- The actual per-user install path, bundled UltraVNC viewer, shortcuts, file copy, launch action and uninstall behaviour remain unchanged.'
            '- No remote-control, cursor, whiteboard, Screen 2 or Agent protocol behaviour changes are included in 1.1.7.'
            '- Classic Arrow remains the default cursor and the 18-cursor pack is unchanged.'
            '- This test installer is currently unsigned, so Windows SmartScreen may show an unknown-publisher/reputation warning.'
          ) -join [Environment]::NewLine

          cmd /c "gh release view $tag --repo $env:GITHUB_REPOSITORY >nul 2>nul"
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the v1.1.7-friend release asset.' }
          }
          else {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --title 'GrevUltraVNC 1.1.7 Friend Test' --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the v1.1.7-friend release.' }
          }

name: Build

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore GrevUltraVNC.slnx
      - name: Build solution
        run: dotnet build GrevUltraVNC.slnx --configuration Release --no-restore

      - name: Smoke test GrevUltraVNC startup
        shell: powershell
        run: |
          $exe = Resolve-Path 'src\GrevUltraVNC\bin\Release\net10.0-windows\GrevUltraVNC.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            throw "GrevUltraVNC exited during startup smoke test with exit code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build GrevUltraVNC 1.1.3 friend installer
        shell: powershell
        run: .\scripts\build-friend-installer.ps1

      - name: Build Grev Agent package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: .\scripts\build-agent-package.ps1

      - name: Publish latest Grev Agent release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'agent-latest'
          $asset = 'dist\GrevUltraVNC-Agent-win-x64.zip'

          cmd /c "gh release view $tag --repo $env:GITHUB_REPOSITORY >nul 2>nul"
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the agent-latest release asset.' }
          }
          else {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --title 'GrevUltraVNC Agent - Latest' --notes 'Automatically built from the latest main branch.' --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the agent-latest release.' }
          }

      - name: Publish GrevUltraVNC 1.1.3 friend release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.1.3-friend'
          $asset = 'dist\GrevUltraVNC-1.1.3-Friend-Setup.exe'
          $notes = @(
            'GrevUltraVNC 1.1.3 Friend Test'
            ''
            '- Shows all six cursor styles as real visual previews in Settings instead of a text-only picker.'
            '- Shows the same six clickable cursor previews inside Grev Control for live switching during a session.'
            '- Cursor previews use your current collaboration colour and are built from the same vector shapes as the live overlay.'
            '- Fixes local cursor selection being overridden by the previous Agent snapshot, so the chosen shape changes immediately under your own mouse.'
            '- Pushes live cursor-style changes to the Agent immediately so other connected Grev users see the new shape without waiting for the next heartbeat.'
            '- Keeps the 1.1.2 right-edge hotspot fix, shared whiteboard eraser/undo and 160 installer messages.'
            '- No Agent protocol bump beyond protocol 15 is required for this controller fix.'
            '- Single Windows installer with the bundled UltraVNC viewer.'
            '- Connect your Zima / private Grev Connect network before using an external GC- ID.'
            '- This test installer is currently unsigned, so Windows SmartScreen may show an unknown-publisher/reputation warning.'
          ) -join [Environment]::NewLine

          cmd /c "gh release view $tag --repo $env:GITHUB_REPOSITORY >nul 2>nul"
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the v1.1.3-friend release asset.' }
          }
          else {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --title 'GrevUltraVNC 1.1.3 Friend Test' --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the v1.1.3-friend release.' }
          }
